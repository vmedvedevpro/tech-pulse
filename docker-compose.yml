services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: techpulse
      POSTGRES_PASSWORD: techpulse
      POSTGRES_DB: techpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: